[v8]
# Switch 2 (kaiHEN) note: switch-v8's prebuilt horizon_mman expects Switch 1's
# direct-alias CodeMemory JIT (it never calls jitTransitionToWritable), whereas
# kaiHEN's libkaihen uses a separate RW staging buffer that requires explicit
# writable->executable transitions. Running jit = off (V8 Ignition interpreter)
# avoids the Isolate::New JIT crash completely while running fast on Switch 2's
# Cortex-A78C CPU.
jit = off
wasm = off
flags = --expose-gc

[memory]
# Claim the maximum 512 MiB V8 heap ceiling (Switch 2 grants ~9 GiB in app mode).
heap_limit = 512MiB

[renderer]
# auto -> GPU-accelerated Skia Ganesh over OunceVK (Vulkan/Zink), 512 MiB cache.
# Set mode = cpu in sdmc:/switch/switch2-MV-loader/nxjs.ini to force CPU raster.
mode = auto
gpu_cache = auto

[threadpool]
size = 4
stack_size = 1MiB
